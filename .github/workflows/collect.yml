name: LFM2 spot collection
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spot-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector data handling
        run: python -m unittest discover -s tests
      - name: Collect market data
        run: python collector.py
      - name: Commit public output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.csv data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update LFM2 spot market data'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Verify API coverage and metrics
        run: python validate.py --require-complete
      - name: Evaluate freshness at read time
        if: always()
        run: python check_latest.py --path data/latest.json --require-usable
