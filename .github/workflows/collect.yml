name: LFM2 spot collection
run-name: BTC collection ${{ inputs.request_id || github.run_id }}
on:
  schedule:
    # Offset from the top of each hour to reduce GitHub scheduler congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional request identifier used by the Work collector'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: spot-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector data handling
        run: python -m unittest discover -s tests
      - name: Collect market data
        env:
          LFM2_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          LFM2_COLLECTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_workflow_dispatch' }}
        run: python collector.py
      - name: Collect seven-day LFM3 price history and measured CVD
        run: python lfm3.py
      - name: Check LFM3 integrity before publication, preserving partial source results
        run: python validate_lfm3.py --allow-partial
      - name: Build compact LFM3 summary for chat readers
        run: python lfm3_summary.py
      - name: Commit public output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.csv data/latest.json data/price_history.csv data/cvd_history.csv data/lfm3_latest.json data/lfm3_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update LFM2 and LFM3 spot market data'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            done
            exit 1
          fi
      - name: Verify legacy API coverage and metrics
        continue-on-error: true
        run: python validate.py --require-complete
      - name: Verify LFM3 candles, indicators and read-time quality
        run: python validate_lfm3.py
      - name: Evaluate legacy freshness at read time
        if: always()
        continue-on-error: true
        run: python check_latest.py --path data/latest.json --require-usable

  lfm32:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded LFM3.2 REST evidence independently of legacy job
        env:
          LFM2_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          LFM2_COLLECTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_workflow_dispatch' }}
        run: python lfm32.py
      - name: Independently validate LFM3.2 archive and arithmetic, allowing explicit source gaps
        run: python validate_lfm32.py
      - name: Retain verifiable source archive
        uses: actions/upload-artifact@v4
        with:
          name: lfm32-source-${{ github.run_id }}
          path: data/lfm32_raw.json.gz
          retention-days: 30
          if-no-files-found: error
      - name: Publish LFM3.2 without changing legacy outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lfm32_latest.json data/lfm32_summary.json data/lfm32_history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m 'Update LFM3.2 verified REST evidence'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            done
            exit 1
          fi
      - name: Report live eligibility separately from collection success
        run: |
          python - <<'PYCODE'
          import json, os
          from lfm32 import refresh_quality
          d = refresh_quality(json.load(open('data/lfm32_latest.json')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('LFM3.2 REST collection completed. Live eligibility: ' + str(d['monitoring_eligible']) + '\n\n')
              f.write('Source errors: `' + json.dumps(d['errors']) + '`\n')
          PYCODE
