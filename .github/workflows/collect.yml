name: LFM2 spot collection
run-name: BTC collection ${{ inputs.request_id || github.run_id }}
on:
  schedule:
    # Offset from the top of each hour to reduce GitHub scheduler congestion.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Optional request identifier used by the Work collector'
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: spot-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector data handling
        run: python -m unittest discover -s tests
      - name: Collect market data
        env:
          LFM2_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
          LFM2_COLLECTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual_workflow_dispatch' }}
        run: python collector.py
      - name: Collect seven-day LFM3 price history and measured CVD
        run: python lfm3.py
      - name: Check LFM3 integrity before publication, preserving partial source results
        run: python validate_lfm3.py --allow-partial
      - name: Build compact LFM3 summary for chat readers
        run: python lfm3_summary.py
      - name: Commit public output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.csv data/latest.json data/price_history.csv data/cvd_history.csv data/lfm3_latest.json data/lfm3_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update LFM2 and LFM3 spot market data'
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            done
            exit 1
          fi
      - name: Verify legacy API coverage and metrics
        continue-on-error: true
        run: python validate.py --require-complete
      - name: Verify LFM3 candles, indicators and read-time quality
        run: python validate_lfm3.py
      - name: Evaluate legacy freshness at read time
        if: always()
        continue-on-error: true
        run: python check_latest.py --path data/latest.json --require-usable

